<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>User Registration</title> <link rel="stylesheet" href="style.css"> </head> <body> <header> <div class="logo">FitLife</div> <nav> <a href="index.html">Home</a> <a href="login.html">Login</a> </nav> </header> <div class="form-container"> <form class="form-box" action="#" method="post">
    <h2>Create Account</h2>
    <p>Register for your fitness journey</p>

    <label>Full Name</label>
    <input type="text" name="name" placeholder="Enter your name" required>

    <label>Email</label>
    <input type="email" name="email" placeholder="Enter your email" required>

    <label>Phone Number</label>
    <input type="tel" name="phone" placeholder="Enter phone number">

    <label>Password</label>
    <input type="password" name="password" placeholder="Enter password" required>

    <label>Confirm Password</label>
    <input type="password" name="confirmPassword" placeholder="Confirm password" required>

    <label>Gender</label>
    <select name="gender">
        <option value="">Select Gender</option>
        <option>Male</option>
        <option>Female</option>
        <option>Other</option>
    </select>

    <button type="submit" class="btn">Register</button>

    <p class="form-link">
        Already have an account?
        <a href="login.html">Login here</a>
    </p>

</form>

</div>
 </body> 
 </html>
